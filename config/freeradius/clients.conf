client localhost {
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SHARED_SECRET}
	shortname = localhost
	# pppd's radius.so (libfreeradius-client) cannot validate Message-Authenticator
	# (attribute 80) in RADIUS replies - it causes "invalid reply digest" and auth
	# failure. Disabling it here prevents FreeRADIUS from adding it to responses
	# sent to the SSTP host (which authenticates via pppd).
	require_message_authenticator = no
}

# AROFi MikroTik NAS clients are appended below this line by entrypoint.sh,
# generated from the RADIUS_CLIENT_CIDR env var.
#
# AROFi is a self-service, nationwide SaaS: any operator anywhere can
# register a router at any time, from any ISP, at an IP nobody on the AROFi
# side knows in advance. There is no "add this router's IP to the server"
# step — onboarding a router must require ZERO server-side or code action.
# So RADIUS_CLIENT_CIDR defaults to 0.0.0.0/0 (accept from anywhere) and
# that is the CORRECT, INTENDED setting for normal operation, not a
# temporary hack.
#
# The real security boundary is NOT source IP — it's:
#   1. The RADIUS_SHARED_SECRET (a NAS can't even get a response without it).
#   2. Every username/password is checked live against Postgres per request
#      (sites-enabled/default's authorize{} block) — must be an ACTIVE,
#      non-expired PackageActivation with a matching RadiusCredential. A
#      stranger who has the shared secret still gets nothing without a real
#      paying customer's live, unexpired, MAC-bound credential.
# Restricting RADIUS_CLIENT_CIDR to specific IPs/CIDRs is an OPTIONAL extra
# for an operator who deliberately runs a closed/private deployment (e.g.
# all routers on one known ISP or VPN) — do not add IP restriction back as a
# "fix" here; it would break self-service onboarding for the rest of the
# country. See config/freeradius/README.md.
