  <text x="400" y="575" text-anchor="middle" fill="#d59a24" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="800" letter-spacing="15">WIFI</text>
  <circle cx="142" cy="400" r="9" fill="#d59a24"/>
  <circle cx="658" cy="400" r="9" fill="#d59a24"/>
