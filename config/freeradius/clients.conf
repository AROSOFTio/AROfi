client localhost {
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SHARED_SECRET}
	shortname = localhost
	# pppd's radius.so (libfreeradius-client) cannot validate Message-Authenticator
	# (attribute 80) in RADIUS replies - it causes "invalid reply digest" and auth
	# failure. Disabling it here prevents FreeRADIUS from adding it to responses
	# sent to the SSTP host (which authenticates via pppd).
	require_message_authenticator = no
}

# AROFi MikroTik NAS clients.
#
# AROFi routers sit behind CGNAT with dynamic WAN IPs, so a static per-IP
# client list is not operable — every AROFi-provisioned MikroTik
# authenticates with the platform RADIUS shared secret instead. The exposure
# is bounded two ways:
#
#   1. RADIUS_CLIENT_CIDR narrows the accepted source range. Default is
#      0.0.0.0/0 ONLY because router WAN IPs are dynamic; production
#      deployments MUST restrict UDP 1812/1813 at the host firewall (ufw /
#      cloud security group) to the ISP CIDRs the routers egress from, or
#      run routers over the AROFi WireGuard/SSTP VPN and set
#      RADIUS_CLIENT_CIDR to the VPN subnet (e.g. 10.66.0.0/16). See
#      config/freeradius/README.md.
#
#   2. RADIUS_REQUIRE_MESSAGE_AUTHENTICATOR=yes enforces Message-Authenticator
#      on Access-Requests (BlastRADIUS mitigation). RouterOS 7.15+ sends it;
#      leave "no" only while pre-7.15 routers are still in the fleet.
client arofi-nas {
	ipaddr = $ENV{RADIUS_CLIENT_CIDR}
	secret = $ENV{RADIUS_SHARED_SECRET}
	shortname = arofi-nas
	nas_type = other
	require_message_authenticator = $ENV{RADIUS_REQUIRE_MESSAGE_AUTHENTICATOR}
}
