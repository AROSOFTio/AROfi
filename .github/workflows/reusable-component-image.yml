name: Build release image

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile.components
      target:
        required: false
        type: string
        default: ''
      channel:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arosoftio/arofi-${{ inputs.component }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=${{ inputs.channel }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arofi-${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=arofi-${{ inputs.component }}
