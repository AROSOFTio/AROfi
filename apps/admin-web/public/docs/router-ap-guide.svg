<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Router and access point guide</title><desc id="d">Illustrated comparison of a MikroTik router, ceiling access point and outdoor access point with deployment notes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity=".12"/></filter></defs><rect width="1400" height="760" rx="34" fill="url(#bg)"/><text x="70" y="78" font-family="Segoe UI,Arial" font-size="40" font-weight="750" fill="#152238">Router and access point roles</text><text x="70" y="116" font-family="Segoe UI,Arial" font-size="21" fill="#667085">The MikroTik controls authentication and traffic. Access points extend the wireless coverage.</text><g font-family="Segoe UI,Arial" filter="url(#s)"><g transform="translate(65 170)"><rect width="400" height="500" rx="30" fill="#fff"/><text x="36" y="52" font-size="24" font-weight="750" fill="#172033">MikroTik router</text><text x="36" y="82" font-size="16" fill="#667085">Gateway, hotspot, RADIUS and traffic rules</text><g transform="translate(54 128)"><rect width="292" height="142" rx="24" fill="#101827"/><rect x="24" y="28" width="112" height="22" rx="5" fill="#28364a"/><text x="80" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#e5eefb">MikroTik</text><g transform="translate(28 82)"><g fill="#22c55e"><circle cx="8" cy="8" r="5"/><circle cx="26" cy="8" r="5"/></g><g fill="#64748b"><rect x="58" width="26" height="30" rx="4"/><rect x="93" width="26" height="30" rx="4"/><rect x="128" width="26" height="30" rx="4"/><rect x="163" width="26" height="30" rx="4"/><rect x="198" width="26" height="30" rx="4"/></g></g><path d="M255 25c22 18 30 42 23 68M238 36c14 12 19 28 14 45" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(36 315)" font-size="17" fill="#344054"><circle cx="9" cy="10" r="7" fill="#2463eb"/><text x="28" y="16">Runs the HotSpot service</text><circle cx="9" cy="55" r="7" fill="#2463eb"/><text x="28" y="61">Sends login requests to RADIUS</text><circle cx="9" cy="100" r="7" fill="#2463eb"/><text x="28" y="106">Enforces speed, expiry and quotas</text><circle cx="9" cy="145" r="7" fill="#2463eb"/><text x="28" y="151">Reports sessions to AROFi</text></g></g><g transform="translate(500 170)"><rect width="400" height="500" rx="30" fill="#fff"/><text x="36" y="52" font-size="24" font-weight="750" fill="#172033">Indoor access point</text><text x="36" y="82" font-size="16" fill="#667085">Ceiling or wall coverage for rooms and shops</text><g transform="translate(85 122)"><ellipse cx="115" cy="80" rx="115" ry="62" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="4"/><ellipse cx="115" cy="75" rx="82" ry="39" fill="#fff"/><path d="M77 71c20-20 56-20 76 0M92 88c12-12 34-12 46 0M111 105h8" fill="none" stroke="#22a35a" stroke-width="7" stroke-linecap="round"/><circle cx="115" cy="126" r="6" fill="#22c55e"/></g><g transform="translate(36 315)" font-size="17" fill="#344054"><circle cx="9" cy="10" r="7" fill="#22a35a"/><text x="28" y="16">One SSID across a site</text><circle cx="9" cy="55" r="7" fill="#22a35a"/><text x="28" y="61">Powered by PoE where supported</text><circle cx="9" cy="100" r="7" fill="#22a35a"/><text x="28" y="106">Best for indoor customer areas</text><circle cx="9" cy="145" r="7" fill="#22a35a"/><text x="28" y="151">Bridge traffic to MikroTik</text></g></g><g transform="translate(935 170)"><rect width="400" height="500" rx="30" fill="#fff"/><text x="36" y="52" font-size="24" font-weight="750" fill="#172033">Outdoor access point</text><text x="36" y="82" font-size="16" fill="#667085">Weather-resistant coverage for compounds</text><g transform="translate(115 117)"><rect x="44" y="0" width="82" height="178" rx="27" fill="#fff" stroke="#cbd5e1" stroke-width="4"/><rect x="60" y="20" width="50" height="100" rx="18" fill="#eef4ff"/><path d="M18 50c-31 31-31 81 0 112M0 26c-45 45-45 116 0 161M152 50c31 31 31 81 0 112M170 26c45 45 45 116 0 161" fill="none" stroke="#2463eb" stroke-width="6" stroke-linecap="round" opacity=".72"/><rect x="79" y="178" width="12" height="53" rx="5" fill="#64748b"/></g><g transform="translate(36 315)" font-size="17" fill="#344054"><circle cx="9" cy="10" r="7" fill="#f59e0b"/><text x="28" y="16">Covers larger open areas</text><circle cx="9" cy="55" r="7" fill="#f59e0b"/><text x="28" y="61">Mount high with clear line of sight</text><circle cx="9" cy="100" r="7" fill="#f59e0b"/><text x="28" y="106">Use proper surge protection</text><circle cx="9" cy="145" r="7" fill="#f59e0b"/><text x="28" y="151">Bridge clients to the router</text></g></g></g></svg>