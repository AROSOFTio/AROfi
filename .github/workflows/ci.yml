name: CI (branch build verify)

# Build + test verification for non-main branches. Pushes to main are already
# verified by the build-verify job in deploy.yml before deployment; this
# workflow gives feature/emergency branches the same gate without deploying.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  build-verify:
    name: Verify Builds Pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install root dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build all apps
        run: npx turbo run build --cache-dir=.turbo
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM || '' }}

      - name: Run tests
        run: npx turbo run test --cache-dir=.turbo
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM || '' }}
