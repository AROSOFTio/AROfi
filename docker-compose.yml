services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "9096:9096"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin-web
      - portal-web
      - api
    networks:
      - arofi-net

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-arofi_dev}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-arofi_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arofi-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me_redis}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_redis}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-change_me_redis} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arofi-net

  freeradius:
    image: freeradius/freeradius-server:latest-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-arofi_dev}
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET:?RADIUS_SHARED_SECRET is required}
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./config/freeradius/clients.conf:/etc/raddb/clients.conf:ro
      - ./config/freeradius/mods-config/files/authorize:/etc/raddb/mods-config/files/authorize:ro
      - ./config/freeradius/mods-available/sql:/etc/raddb/mods-available/sql:ro
      - ./config/freeradius/sites-enabled/default:/etc/raddb/sites-enabled/default:ro
      - ./config/freeradius/sites-enabled/inner-tunnel:/etc/raddb/sites-enabled/inner-tunnel:ro
      - ./config/freeradius/entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'User-Name = arofi-health\nUser-Password = radius-health\n' | radclient -x 127.0.0.1 auth $${RADIUS_SHARED_SECRET} | grep -q 'Access-Accept'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - arofi-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-arofi_dev}?schema=public
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change_me_redis}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - PORTAL_TOKEN_SECRET=${PORTAL_TOKEN_SECRET:?PORTAL_TOKEN_SECRET is required}
      - NODE_ENV=production
      - PAYMENT_DEFAULT_PROVIDER=${PAYMENT_DEFAULT_PROVIDER:-PESAPAL}
      - YO_API_MODE=${YO_API_MODE:-live}
      - YO_API_BASE_URL=${YO_API_BASE_URL:-https://paymentsapi1.yo.co.ug/ybs/task.php}
      - YO_API_FALLBACK_URL=${YO_API_FALLBACK_URL:-https://paymentsapi2.yo.co.ug/ybs/task.php}
      - YO_API_USERNAME=${YO_API_USERNAME:-}
      - YO_API_PASSWORD=${YO_API_PASSWORD:-}
      - YO_WEBHOOK_BASE_URL=${YO_WEBHOOK_BASE_URL:-https://arofi.arosoft.io/api/payments/webhooks/yo-uganda}
      - YO_WEBHOOK_TOKEN=${YO_WEBHOOK_TOKEN:-}
      - PESAPAL_MODE=${PESAPAL_MODE:-live}
      - PESAPAL_BASE_URL=${PESAPAL_BASE_URL:-}
      - PESAPAL_CONSUMER_KEY=${PESAPAL_CONSUMER_KEY:-}
      - PESAPAL_CONSUMER_SECRET=${PESAPAL_CONSUMER_SECRET:-}
      - PESAPAL_IPN_ID=${PESAPAL_IPN_ID:-}
      - PESAPAL_CALLBACK_URL=${PESAPAL_CALLBACK_URL:-https://arofi.arosoft.io/api/payments/webhooks/pesapal}
      - PESAPAL_WEBHOOK_TOKEN=${PESAPAL_WEBHOOK_TOKEN:-}
      - PESAPAL_HOST=${PESAPAL_HOST:-pay.pesapal.com}
      - ROUTER_CREDENTIAL_SECRET=${ROUTER_CREDENTIAL_SECRET:?ROUTER_CREDENTIAL_SECRET is required}
      - RADIUS_SERVER_HOST=${RADIUS_SERVER_HOST:-freeradius}
      - RADIUS_PUBLIC_HOST=${RADIUS_PUBLIC_HOST:-95.111.234.34}
      - RADIUS_AUTH_PORT=${RADIUS_AUTH_PORT:-1812}
      - RADIUS_ACCOUNTING_PORT=${RADIUS_ACCOUNTING_PORT:-1813}
      - RADIUS_SHARED_SECRET=${RADIUS_SHARED_SECRET:?RADIUS_SHARED_SECRET is required}
      - RADIUS_INTERNAL_API_KEY=${RADIUS_INTERNAL_API_KEY:?RADIUS_INTERNAL_API_KEY is required}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:9096}
      - PORTAL_PUBLIC_HOST=${PORTAL_PUBLIC_HOST:-arofi.arosoft.io}
      - API_PUBLIC_HOST=${API_PUBLIC_HOST:-arofi.arosoft.io}
      - ACCESS_WORKERS_ENABLED=${ACCESS_WORKERS_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - arofi-net

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - API_SERVER_URL=http://api:3000/api
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - arofi-net

  portal-web:
    build:
      context: ./apps/portal-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - API_SERVER_URL=http://api:3000/api
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - arofi-net

networks:
  arofi-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
