<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">AROFi payment flow</title><desc id="d">A customer chooses a package, enters a phone number, approves Mobile Money, the gateway confirms payment and AROFi activates internet access.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".11"/></filter></defs><rect width="1400" height="760" rx="34" fill="url(#bg)"/><text x="70" y="78" font-family="Segoe UI,Arial" font-size="40" font-weight="760" fill="#172033">From payment request to internet access</text><text x="70" y="116" font-family="Segoe UI,Arial" font-size="21" fill="#667085">The browser starts the request, but provider confirmation is the financial authority.</text><g font-family="Segoe UI,Arial" filter="url(#s)"><g transform="translate(70 190)"><rect width="235" height="410" rx="28" fill="#fff"/><circle cx="117" cy="78" r="45" fill="#eef4ff"/><path d="M84 78h66M117 45v66" stroke="#2463eb" stroke-width="8" stroke-linecap="round"/><text x="117" y="158" text-anchor="middle" font-size="22" font-weight="750" fill="#172033">1. Select package</text><rect x="30" y="195" width="175" height="68" rx="13" fill="#f8fafc" stroke="#d5deea"/><text x="48" y="221" font-size="14" fill="#667085">Lite</text><text x="48" y="249" font-size="20" font-weight="750" fill="#172033">UGX 500</text><rect x="30" y="285" width="175" height="45" rx="10" fill="#2463eb"/><text x="117" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Continue</text></g><g transform="translate(330 190)"><rect width="235" height="410" rx="28" fill="#fff"/><rect x="67" y="28" width="102" height="152" rx="20" fill="#111827"/><rect x="77" y="42" width="82" height="116" rx="13" fill="#eef4ff"/><text x="118" y="91" text-anchor="middle" font-size="16" font-weight="750" fill="#172033">+256</text><text x="118" y="119" text-anchor="middle" font-size="14" fill="#667085">7•• ••• •••</text><circle cx="118" cy="168" r="5" fill="#64748b"/><text x="117" y="226" text-anchor="middle" font-size="22" font-weight="750" fill="#172033">2. Enter number</text><rect x="30" y="263" width="175" height="52" rx="11" fill="#f8fafc" stroke="#d5deea"/><text x="48" y="295" font-size="15" fill="#667085">MTN or Airtel</text><text x="117" y="352" text-anchor="middle" font-size="15" fill="#667085">AROFi routes through the</text><text x="117" y="376" text-anchor="middle" font-size="15" fill="#667085">selected live gateway.</text></g><g transform="translate(590 190)"><rect width="235" height="410" rx="28" fill="#fff"/><circle cx="117" cy="88" r="52" fill="#fff7ed"/><path d="M90 89l20 20 37-43" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="175" text-anchor="middle" font-size="22" font-weight="750" fill="#172033">3. Approve prompt</text><text x="117" y="215" text-anchor="middle" font-size="15" fill="#667085">The customer confirms</text><text x="117" y="239" text-anchor="middle" font-size="15" fill="#667085">the Mobile Money request.</text><rect x="30" y="278" width="175" height="70" rx="13" fill="#fffbeb" stroke="#fde68a"/><text x="117" y="305" text-anchor="middle" font-size="14" font-weight="650" fill="#92400e">Pending</text><text x="117" y="330" text-anchor="middle" font-size="13" fill="#a16207">Waiting for provider</text></g><g transform="translate(850 190)"><rect width="235" height="410" rx="28" fill="#fff"/><path d="M65 104c-15-39 17-74 56-69 25-29 74-12 73 25 36 3 45 57 11 72H72c-26-3-33-24-7-28Z" fill="#2463eb"/><text x="132" y="99" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">Gateway</text><text x="117" y="175" text-anchor="middle" font-size="22" font-weight="750" fill="#172033">4. Confirm status</text><text x="117" y="215" text-anchor="middle" font-size="15" fill="#667085">Callback and status check</text><text x="117" y="239" text-anchor="middle" font-size="15" fill="#667085">confirm the transaction.</text><rect x="30" y="278" width="175" height="70" rx="13" fill="#ecfdf3" stroke="#a7f3d0"/><text x="117" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#087443">Completed</text><text x="117" y="330" text-anchor="middle" font-size="13" fill="#15803d">Authoritative result</text></g><g transform="translate(1110 190)"><rect width="235" height="410" rx="28" fill="#fff"/><circle cx="117" cy="88" r="52" fill="#ecfdf3"/><path d="M82 90l23 23 47-55" fill="none" stroke="#22a35a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="117" y="175" text-anchor="middle" font-size="22" font-weight="750" fill="#172033">5. Activate access</text><text x="117" y="215" text-anchor="middle" font-size="15" fill="#667085">Package credentials are</text><text x="117" y="239" text-anchor="middle" font-size="15" fill="#667085">created and RADIUS opens</text><text x="117" y="263" text-anchor="middle" font-size="15" fill="#667085">the customer session.</text><rect x="30" y="302" width="175" height="46" rx="23" fill="#22a35a"/><text x="117" y="331" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Internet active</text></g></g><g stroke="#9aa8bd" stroke-width="5" fill="none" stroke-linecap="round"><path d="M305 395h25"/><path d="M565 395h25"/><path d="M825 395h25"/><path d="M1085 395h25"/></g></svg>