client localhost {
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SHARED_SECRET}
	shortname = localhost
	# pppd's radius.so (libfreeradius-client) cannot validate Message-Authenticator
	# (attribute 80) in RADIUS replies - it causes "invalid reply digest" and auth
	# failure. Disabling it here prevents FreeRADIUS from adding it to responses
	# sent to the SSTP host (which authenticates via pppd).
	require_message_authenticator = no
}

# Catch-all AROFi NAS client.
#
# Every AROFi-provisioned MikroTik authenticates with the single platform
# RADIUS shared secret (RADIUS_SHARED_SECRET). FreeRADIUS only reads the SQL
# `nas` table at startup, so a newly registered router was rejected as an
# "unknown client" until a full restart — which is why paid customers could
# never actually get online. Accepting any source IP that presents the correct
# shared secret removes that per-router reload requirement, so a router works
# the moment its script is imported. The SQL `nas` table is still used for
# accounting/identification; this block only governs auth acceptance.
client arofi-nas {
	ipaddr = 0.0.0.0/0
	secret = $ENV{RADIUS_SHARED_SECRET}
	shortname = arofi-nas
	nas_type = other
	# pppd's radius.so (libfreeradius-client) cannot validate Message-Authenticator
	# (attribute 80) in RADIUS replies - it causes "invalid reply digest" and auth
	# failure. Disabling it here prevents FreeRADIUS from adding it to responses
	# for all NAS clients (MikroTik hotspot routers and the SSTP host).
	require_message_authenticator = no
}
