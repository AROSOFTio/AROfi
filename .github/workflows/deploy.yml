name: Deploy AROFi production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/admin-web/src/components/RouterFullEditModal.tsx'
      - 'apps/admin-web/src/app/(dashboard)/admin/settings/routers/page.tsx'
      - 'apps/admin-web/src/lib/client-api.ts'
      - 'apps/api/src/modules/routers/**'
      - 'scripts/enable_router_full_management_v2.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: arofi-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Backup, clean build and deploy Contabo production
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout exact production release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Clean disposable runner release files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path $env:RUNNER_TEMP -Filter 'arofi-*.tar' -File -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host 'Runner temporary AROFi release archives cleaned. Repository checkout is an exact clean Git checkout.'

      - name: Package and deploy exact commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $hostName = if ([string]::IsNullOrWhiteSpace($env:PROD_SSH_HOST)) { '95.111.234.34' } else { $env:PROD_SSH_HOST.Trim() }
          $userName = if ([string]::IsNullOrWhiteSpace($env:PROD_SSH_USER)) { 'root' } else { $env:PROD_SSH_USER.Trim() }
          $target = "$userName@$hostName"
          $sha = '${{ github.sha }}'
          $archive = Join-Path $env:RUNNER_TEMP "arofi-$sha.tar"
          $temporaryKeyFile = $null
          $identityKey = $null

          $sshArgs = @(
            '-o', 'BatchMode=yes',
            '-o', 'IdentitiesOnly=yes',
            '-o', 'StrictHostKeyChecking=accept-new',
            '-o', 'ConnectTimeout=15',
            '-o', 'ServerAliveInterval=20',
            '-o', 'ServerAliveCountMax=3'
          )

          try {
            if (-not [string]::IsNullOrWhiteSpace($env:PROD_SSH_PRIVATE_KEY)) {
              $temporaryKeyFile = Join-Path $env:RUNNER_TEMP 'arofi-production-ssh-key'
              $normalizedKey = $env:PROD_SSH_PRIVATE_KEY.Replace("`r`n", "`n").Trim() + "`n"
              $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
              [System.IO.File]::WriteAllText($temporaryKeyFile, $normalizedKey, $utf8NoBom)
              & icacls.exe $temporaryKeyFile /inheritance:r | Out-Null
              & icacls.exe $temporaryKeyFile /grant:r "$($env:USERNAME):(R)" | Out-Null
              $identityKey = $temporaryKeyFile
            }
            else {
              $runnerSshDir = Join-Path $env:USERPROFILE '.ssh'
              $identityKey = Join-Path $runnerSshDir 'arofi-production-actions'
              $publicKeyFile = "$identityKey.pub"
              New-Item -ItemType Directory -Path $runnerSshDir -Force | Out-Null
              if (-not (Test-Path $identityKey) -or -not (Test-Path $publicKeyFile)) {
                Write-Host 'No persistent AROFi deployment key found on this runner; generating an Ed25519 keypair.'
                & ssh-keygen.exe -q -t ed25519 -f $identityKey -N '""' -C 'arofi-production-actions'
                if ($LASTEXITCODE -ne 0) { throw 'Could not generate the runner production deployment key.' }
              }
              $publicKey = (Get-Content $publicKeyFile -Raw).Trim()
              Write-Host 'AROFi runner deployment PUBLIC key (safe to add to /root/.ssh/authorized_keys):'
              Write-Host $publicKey
            }

            $sshArgs += @('-i', $identityKey)
            Write-Host "Checking production SSH access to $target"
            & ssh.exe @sshArgs $target 'id -u | grep -qx 0 && docker info >/dev/null && ip -4 addr show | grep -Fq 95.111.234.34'
            if ($LASTEXITCODE -ne 0) {
              if ([string]::IsNullOrWhiteSpace($env:PROD_SSH_PRIVATE_KEY)) {
                $publicKey = (Get-Content "$identityKey.pub" -Raw).Trim()
                Write-Host 'AUTHORIZE THIS PUBLIC KEY ON PRODUCTION, THEN RE-RUN THIS JOB:'
                Write-Host $publicKey
              }
              throw 'Production SSH preflight failed. No production changes were made.'
            }

            if (Test-Path $archive) { Remove-Item $archive -Force }
            & git.exe archive --format=tar -o $archive $sha
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) { throw 'Could not package the exact Git commit.' }

            Write-Host 'Uploading immutable release archive'
            $scpArgs = @(
              '-o', 'BatchMode=yes',
              '-o', 'IdentitiesOnly=yes',
              '-o', 'StrictHostKeyChecking=accept-new',
              '-o', 'ConnectTimeout=15',
              '-i', $identityKey
            )
            & scp.exe @scpArgs $archive "${target}:/tmp/arofi-$sha.tar"
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }

            $remoteDir = "/root/arofi-runner-releases/$sha"
            $remoteCommand = "set -e; mkdir -p '$remoteDir'; find '$remoteDir' -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; tar -xf '/tmp/arofi-$sha.tar' -C '$remoteDir'; chmod +x '$remoteDir/scripts/deploy-production-runner.sh'; cd '$remoteDir'; python3 scripts/forbid_mikrotik_auto_mac_auth.py; python3 scripts/enforce_business_voucher_qr.py; python3 scripts/enforce_instant_captive_completion.py; python3 scripts/verify_router_captive_invariants.py; bash -n scripts/deploy-production-runner.sh; python3 scripts/tune_production_nginx_buffers.py; AROFI_RELEASE_SHA='$sha' bash scripts/deploy-production-runner.sh '$remoteDir'; rm -f '/tmp/arofi-$sha.tar'"

            Write-Host 'Starting rollback-safe production deployment'
            & ssh.exe @sshArgs $target $remoteCommand
            if ($LASTEXITCODE -ne 0) { throw "Production deployment failed with exit code $LASTEXITCODE. Review rollback metadata on the server." }
          }
          finally {
            if (Test-Path $archive) { Remove-Item $archive -Force -ErrorAction SilentlyContinue }
            if ($temporaryKeyFile -and (Test-Path $temporaryKeyFile)) { Remove-Item $temporaryKeyFile -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify public production after deployment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $health = Invoke-RestMethod -Uri 'https://arofi.net/api/health' -TimeoutSec 20
          if ($health.status -ne 'ok') { throw 'Production API health response was not OK.' }
          $homepage = Invoke-WebRequest -Uri 'https://arofi.net/' -TimeoutSec 20 -UseBasicParsing
          if ($homepage.StatusCode -ne 200) { throw "AROFi production homepage returned HTTP $($homepage.StatusCode)" }
          Write-Host "AROFi production is healthy at commit ${{ github.sha }}"
