name: Emergency recover AROFi production routing

on:
  push:
    paths:
      - '.github/workflows/recover-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Identify AROFi public proxy owner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect public proxy process and configuration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $key = Join-Path $env:USERPROFILE '.ssh\arofi-production-actions'
          $remote = @'
          set -e
          echo '=== HOST PORTS 80/443 ==='
          ss -ltnp | grep -E ':(80|443) ' || true
          echo '=== DOCKER PUBLISHED 80/443 ==='
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' | grep -E '80->|443->|0\.0\.0\.0:80|0\.0\.0\.0:443|edge-nginx' || true
          echo '=== EDGE VERSION ==='
          docker exec edge-nginx nginx -v 2>&1 || true
          echo '=== EDGE MAIN NGINX.CONF ==='
          docker exec edge-nginx cat /etc/nginx/nginx.conf 2>&1 || true
          echo '=== EDGE NGINX -T FIRST 160 LINES ==='
          docker exec edge-nginx nginx -T 2>&1 | sed -n '1,160p' || true
          echo '=== HOST NGINX ==='
          command -v nginx && nginx -v 2>&1 || true
          echo '=== PUBLIC LOCAL HOST HEADER TEST HTTP ==='
          curl -sS -D - -o /tmp/arofi-http-body -H 'Host: arofi.net' --max-time 10 http://127.0.0.1/api/health || true
          cat /tmp/arofi-http-body 2>/dev/null || true
          '@
          $remote = $remote.Replace("`r`n", "`n").Replace("`r", "`n")
          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($remote))
          $sshArgs = @('-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=accept-new','-o','ConnectTimeout=15','-i',$key)
          & ssh.exe @sshArgs 'root@95.111.234.34' "echo '$encoded' | base64 -d | bash"
          if ($LASTEXITCODE -ne 0) { throw "Inspection failed: $LASTEXITCODE" }
