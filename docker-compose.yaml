# Coolify deployment for AROFi.
#
# Build the monorepo runtime once. Building the four near-identical runtime
# targets concurrently makes Coolify run the Admin/Portal/API builders four
# times, which exhausts an 8 GiB server during Next.js trace collection. Each
# service below starts the same image with its own SERVICE_NAME instead.

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-production}
  AROFI_DEPLOYMENT_ENV: ${AROFI_DEPLOYMENT_ENV:-unset}
  DATABASE_URL: postgresql://${POSTGRES_USER:-arofi}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-arofi}?schema=public
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-arofi}
  CACHE_VERSION: ${CACHE_VERSION:-v1}
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  PORTAL_TOKEN_SECRET: ${PORTAL_TOKEN_SECRET:?PORTAL_TOKEN_SECRET is required}
  ROUTER_CREDENTIAL_SECRET: ${ROUTER_CREDENTIAL_SECRET:?ROUTER_CREDENTIAL_SECRET is required}
  RADIUS_INTERNAL_API_KEY: ${RADIUS_INTERNAL_API_KEY:?RADIUS_INTERNAL_API_KEY is required}
  RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET:?RADIUS_SHARED_SECRET is required}

  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://arofi.net}
  API_PUBLIC_HOST: ${API_PUBLIC_HOST:-arofi.net}
  PORTAL_PUBLIC_HOST: ${PORTAL_PUBLIC_HOST:-arofi.net}
  APP_BASE_URL: ${APP_BASE_URL:-https://arofi.net}
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:-https://arofi.net}
  PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://arofi.net/portal}
  VOUCHER_QR_LOCAL_LOGIN_URL: ${VOUCHER_QR_LOCAL_LOGIN_URL:-http://10.55.0.1/login}
  MIKROTIK_CALLBACK_HTTP_URL: ${MIKROTIK_CALLBACK_HTTP_URL:-http://95.111.234.34:18080}

  ACCESS_WORKERS_ENABLED: ${ACCESS_WORKERS_ENABLED:-true}
  ACCESS_WORKER_INTERVAL_MS: ${ACCESS_WORKER_INTERVAL_MS:-5000}
  RADIUS_DB_LISTEN_ENABLED: ${RADIUS_DB_LISTEN_ENABLED:-true}
  RADIUS_DISCONNECT_MAX_RETRIES: ${RADIUS_DISCONNECT_MAX_RETRIES:-5}
  ROUTER_HEARTBEAT_SECONDS: ${ROUTER_HEARTBEAT_SECONDS:-2}
  ROUTER_LIVE_WINDOW_SECONDS: ${ROUTER_LIVE_WINDOW_SECONDS:-12}
  ROUTER_STALE_WINDOW_SECONDS: ${ROUTER_STALE_WINDOW_SECONDS:-30}

  ADMIN_OTP_TTL_MINUTES: ${ADMIN_OTP_TTL_MINUTES:-10}
  ADMIN_OTP_MAX_ATTEMPTS: ${ADMIN_OTP_MAX_ATTEMPTS:-5}
  ADMIN_OTP_RESEND_COOLDOWN_SECONDS: ${ADMIN_OTP_RESEND_COOLDOWN_SECONDS:-60}
  ADMIN_LOGIN_MAX_FAILURES: ${ADMIN_LOGIN_MAX_FAILURES:-8}
  ADMIN_LOGIN_LOCKOUT_WINDOW_MINUTES: ${ADMIN_LOGIN_LOCKOUT_WINDOW_MINUTES:-15}

  ALERT_EMAIL: ${ALERT_EMAIL:-}
  WEBHOOK_ALLOW_QUERY_SECRET: ${WEBHOOK_ALLOW_QUERY_SECRET:-false}
  HOTSPOT_LOGIN_URL: ${HOTSPOT_LOGIN_URL:-http://10.55.0.1/login}
  PORTAL_DEFAULT_TENANT_DOMAIN: ${PORTAL_DEFAULT_TENANT_DOMAIN:-}

  RADIUS_SERVER_HOST: ${RADIUS_SERVER_HOST:-127.0.0.1}
  RADIUS_PUBLIC_HOST: ${RADIUS_PUBLIC_HOST:-167.233.68.36}
  RADIUS_AUTH_PORT: ${RADIUS_AUTH_PORT:-1812}
  RADIUS_ACCOUNTING_PORT: ${RADIUS_ACCOUNTING_PORT:-1813}
  RADIUS_SECONDARY_HOST: ${RADIUS_SECONDARY_HOST:-}
  RADIUS_DISCONNECT_ENABLED: ${RADIUS_DISCONNECT_ENABLED:-true}
  RADIUS_DISCONNECT_HOST: ${RADIUS_DISCONNECT_HOST:-}
  RADIUS_DISCONNECT_PORT: ${RADIUS_DISCONNECT_PORT:-3799}
  RADIUS_DISCONNECT_SECRET: ${RADIUS_DISCONNECT_SECRET:-}

  PAYMENT_CUSTOMER_LABEL: ${PAYMENT_CUSTOMER_LABEL:-Pay}
  PAYMENT_DEFAULT_CURRENCY: ${PAYMENT_DEFAULT_CURRENCY:-UGX}
  PLATFORM_PAYMENT_GATEWAY: ${PLATFORM_PAYMENT_GATEWAY:-YO_UGANDA}

  YO_UGANDA_BASE_URL: ${YO_UGANDA_BASE_URL:-https://paymentsapi1.yo.co.ug/ybs/task.php}
  YO_UGANDA_USERNAME: ${YO_UGANDA_USERNAME:-}
  YO_UGANDA_PASSWORD: ${YO_UGANDA_PASSWORD:-}
  YO_UGANDA_WEBHOOK_SECRET: ${YO_UGANDA_WEBHOOK_SECRET:-}
  AGGREGATOR_PROVIDER: ${AGGREGATOR_PROVIDER:-YO_UGANDA}
  AGGREGATOR_WEBHOOK_SECRET: ${AGGREGATOR_WEBHOOK_SECRET:-}

  IOTEC_CLIENT_ID: ${IOTEC_CLIENT_ID:-}
  IOTEC_CLIENT_SECRET: ${IOTEC_CLIENT_SECRET:-}
  IOTEC_WALLET_ID: ${IOTEC_WALLET_ID:-}
  IOTEC_IDENTITY_BASE_URL: ${IOTEC_IDENTITY_BASE_URL:-https://id.iotec.io}
  IOTEC_PAY_BASE_URL: ${IOTEC_PAY_BASE_URL:-https://pay.iotec.io}
  IOTEC_WEBHOOK_SECRET: ${IOTEC_WEBHOOK_SECRET:-}

  MTN_COLLECTION_PROVIDER: ${MTN_COLLECTION_PROVIDER:-AGGREGATOR}
  MTN_DISBURSEMENT_PROVIDER: ${MTN_DISBURSEMENT_PROVIDER:-MTN_MOMO_DIRECT}
  MTN_MOMO_COLLECTION_BASE_URL: ${MTN_MOMO_COLLECTION_BASE_URL:-}
  MTN_MOMO_COLLECTION_SUBSCRIPTION_KEY: ${MTN_MOMO_COLLECTION_SUBSCRIPTION_KEY:-}
  MTN_MOMO_COLLECTION_API_USER: ${MTN_MOMO_COLLECTION_API_USER:-}
  MTN_MOMO_COLLECTION_API_KEY: ${MTN_MOMO_COLLECTION_API_KEY:-}
  MTN_MOMO_COLLECTION_WEBHOOK_SECRET: ${MTN_MOMO_COLLECTION_WEBHOOK_SECRET:-}
  MTN_MOMO_DISBURSEMENT_BASE_URL: ${MTN_MOMO_DISBURSEMENT_BASE_URL:-}
  MTN_MOMO_DISBURSEMENT_SUBSCRIPTION_KEY: ${MTN_MOMO_DISBURSEMENT_SUBSCRIPTION_KEY:-}
  MTN_MOMO_DISBURSEMENT_API_USER: ${MTN_MOMO_DISBURSEMENT_API_USER:-}
  MTN_MOMO_DISBURSEMENT_API_KEY: ${MTN_MOMO_DISBURSEMENT_API_KEY:-}
  MTN_MOMO_DISBURSEMENT_WEBHOOK_SECRET: ${MTN_MOMO_DISBURSEMENT_WEBHOOK_SECRET:-}
  MTN_MOMO_TARGET_ENVIRONMENT: ${MTN_MOMO_TARGET_ENVIRONMENT:-sandbox}
  MTN_MOMO_CURRENCY: ${MTN_MOMO_CURRENCY:-UGX}
  MTN_ALLOWED_PREFIXES: ${MTN_ALLOWED_PREFIXES:-}

  AIRTEL_COLLECTION_PROVIDER: ${AIRTEL_COLLECTION_PROVIDER:-AGGREGATOR}
  AIRTEL_DISBURSEMENT_PROVIDER: ${AIRTEL_DISBURSEMENT_PROVIDER:-AIRTEL_MONEY_DIRECT}
  AIRTEL_MONEY_COLLECTION_BASE_URL: ${AIRTEL_MONEY_COLLECTION_BASE_URL:-}
  AIRTEL_MONEY_DISBURSEMENT_BASE_URL: ${AIRTEL_MONEY_DISBURSEMENT_BASE_URL:-}
  AIRTEL_MONEY_CLIENT_ID: ${AIRTEL_MONEY_CLIENT_ID:-}
  AIRTEL_MONEY_CLIENT_SECRET: ${AIRTEL_MONEY_CLIENT_SECRET:-}
  AIRTEL_MONEY_PUBLIC_KEY: ${AIRTEL_MONEY_PUBLIC_KEY:-}
  AIRTEL_MONEY_COLLECTION_WEBHOOK_SECRET: ${AIRTEL_MONEY_COLLECTION_WEBHOOK_SECRET:-}
  AIRTEL_MONEY_DISBURSEMENT_WEBHOOK_SECRET: ${AIRTEL_MONEY_DISBURSEMENT_WEBHOOK_SECRET:-}
  AIRTEL_MONEY_COUNTRY: ${AIRTEL_MONEY_COUNTRY:-UG}
  AIRTEL_MONEY_CURRENCY: ${AIRTEL_MONEY_CURRENCY:-UGX}
  AIRTEL_ALLOWED_PREFIXES: ${AIRTEL_ALLOWED_PREFIXES:-}

  PESAPAL_MODE: ${PESAPAL_MODE:-sandbox}
  PESAPAL_BASE_URL: ${PESAPAL_BASE_URL:-https://cybqa.pesapal.com/pesapalv3}
  PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY:-}
  PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET:-}
  PESAPAL_IPN_ID: ${PESAPAL_IPN_ID:-}
  PESAPAL_CALLBACK_URL: ${PESAPAL_CALLBACK_URL:-https://arofi.net/portal}

  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AROFi}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@arofi.net}
  SMTP_ALLOW_SELF_SIGNED_CERT: ${SMTP_ALLOW_SELF_SIGNED_CERT:-false}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}

  WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-http://whatsapp:3000}
  WHATSAPP_GATEWAY_API_KEY: ${WHATSAPP_GATEWAY_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  SENTRY_DSN: ${SENTRY_DSN:-}

  PORT: ${PORT:-3000}

# Web containers do not receive database, JWT, payment or router secrets.
x-web-env: &web-env
  NODE_ENV: ${NODE_ENV:-production}
  API_SERVER_URL: ${API_SERVER_URL:-http://api:3000/api}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
  APP_BASE_URL: ${APP_BASE_URL:-https://arofi.net}
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:-https://arofi.net}
  PORTAL_BASE_URL: ${PORTAL_BASE_URL:-https://arofi.net/portal}
  HOTSPOT_LOGIN_URL: ${HOTSPOT_LOGIN_URL:-http://10.55.0.1/login}
  PORT: "3000"
  HOSTNAME: 0.0.0.0

services:
  nginx:
    image: arofi-runtime:${AROFI_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      SERVICE_NAME: nginx
      SERVICE_FQDN_NGINX_3000: ${SERVICE_FQDN_NGINX_3000:-}
    ports:
      - "${MIKROTIK_BOOTSTRAP_HTTP_PORT:-18080}:3001"
    depends_on:
      - api
      - admin
      - portal
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: arofi-runtime:${AROFI_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${WINBOX_PROXY_HOST_PORT_RANGE:-31000-31100}:31000-31100"
    environment:
      <<: *api-env
      SERVICE_NAME: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 240s

  admin:
    image: arofi-runtime:${AROFI_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *web-env
      SERVICE_NAME: admin
    depends_on:
      - api
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  portal:
    image: arofi-runtime:${AROFI_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *web-env
      SERVICE_NAME: portal
    depends_on:
      - api
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/portal 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  freeradius:
    build:
      context: .
      dockerfile: config/freeradius/Dockerfile
    image: arofi-freeradius:${AROFI_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET:?RADIUS_SHARED_SECRET is required}
      RADIUS_CLIENT_CIDR: ${RADIUS_CLIENT_CIDR:-0.0.0.0/0}
      RADIUS_REQUIRE_MESSAGE_AUTHENTICATOR: ${RADIUS_REQUIRE_MESSAGE_AUTHENTICATOR:-no}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-arofi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-arofi}
    depends_on:
      - postgres
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pidof radiusd >/dev/null 2>&1 || pidof freeradius >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arofi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-arofi}
    volumes:
      - pg-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arofi} -d ${POSTGRES_DB:-arofi}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  whatsapp:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "${WHATSAPP_HOST_PORT:-3005}:3000"
    environment:
      - WAHA_PRINT_QR=true
      - WAHA_API_KEY=${WHATSAPP_GATEWAY_API_KEY:-}
    volumes:
      - wa-sessions:/app/.sessions
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget --header=X-Api-Key:$${WAHA_API_KEY} -qO- http://localhost:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  backup:
    build:
      context: .
      dockerfile: config/backup/Dockerfile
    image: arofi-backup:${AROFI_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arofi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-arofi}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-arofi}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
    depends_on:
      - postgres
    volumes:
      - backup-data:/backups
    mem_limit: 128m

volumes:
  pg-data:
  wa-sessions:
  backup-data:
