worker_processes auto;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # --- TCP optimisations ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 200;
    reset_timedout_connection on;

    # --- Buffer tuning ---
    client_body_buffer_size 16k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --- Gzip (broad compatibility) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript text/xml text/x-component
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/truetype font/opentype
        application/vnd.ms-fontobject application/x-font-ttf;

    # --- Logging ---
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # --- WebSocket upgrade map ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Coolify's outer proxy (Traefik) terminates TLS and forwards plain HTTP
    # to this container, so nginx's own $scheme here is ALWAYS "http" even
    # when the real client connected over HTTPS. Blindly forwarding $scheme
    # downstream as X-Forwarded-Proto would tell the Node apps every request
    # is insecure. Preserve whatever X-Forwarded-Proto Traefik already set;
    # only fall back to $scheme for direct/local access with no proxy in front.
    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # All three Node services run inside THIS container on localhost:
    #   api        -> 127.0.0.1:3001
    #   admin-web  -> 127.0.0.1:3002
    #   portal-web -> 127.0.0.1:3003
    upstream api_upstream    { server 127.0.0.1:3001 max_fails=0; keepalive 16; }
    upstream admin_upstream  { server 127.0.0.1:3002 max_fails=0; keepalive 16; }
    upstream portal_upstream { server 127.0.0.1:3003 max_fails=0; keepalive 16; }

    # Plain HTTP MikroTik bootstrap and captive customer API fallback endpoint,
    # exposed by docker-compose on host port 18080. This intentionally serves
    # only router bootstrap assets and pre-login customer portal/payment calls;
    # the admin dashboard, portal, and general API remain behind HTTPS.
    server {
        listen 3001;
        server_name _;

        # Captive-portal HTTP fallback. Router-hosted login.html and some
        # Android captive browsers retry voucher/payment calls against the raw
        # public IP on this listener when HTTPS or public DNS is unavailable
        # before authentication. Keep this scoped to customer pre-login flows.
        location /api/portal/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host arofi.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        }

        location /api/payments/portal/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host arofi.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        }

        location ~ ^/api/payments/[^/]+/check-status$ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host arofi.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        }

        location /api/mikrotik/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        }

        location = /api/health {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto http;
            add_header Cache-Control "no-store" always;
        }

        location / {
            return 404;
        }
    }

    server {
        # Coolify proxies the public domain to this container's port 3000.
        listen 3000;
        server_name arofi.arosoftlabs.com arofi.net app.arofi.net _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "geolocation=(), microphone=()" always;

        # ── Single-domain consolidation ──────────────────────────────────────
        # app.arofi.net is retired. Permanently (301) redirect every request on
        # it to the same path on arofi.net, so old links/bookmarks keep working
        # and Google consolidates all ranking onto the one primary domain.
        # arofi.net then serves EVERYTHING directly below (marketing, /docs,
        # /blog, /portal, /dashboard, /api) with no cross-domain redirects —
        # which is what makes the marketing + docs + blog indexable again.
        if ($host = app.arofi.net) {
            return 301 https://arofi.net$request_uri;
        }
        # Legacy domain from before the arofi.net migration — same treatment,
        # so old printed voucher QRs and bookmarks still resolve.
        if ($host = arofi.arosoftlabs.com) {
            return 301 https://arofi.net$request_uri;
        }

        # Admin realtime SSE stream (/api/events/stream). Must come BEFORE the
        # general /api/ block (nginx picks the longest matching prefix, so
        # this wins for these paths regardless of file order, but keeping it
        # first is clearer to read). Default proxy_buffering would hold each
        # event in nginx's buffer instead of flushing it immediately,
        # silently turning a "<2 second" realtime dashboard into one that
        # updates only every few seconds (or on buffer flush) — defeating the
        # entire point of the SSE bus. proxy_read_timeout is generous because
        # this is a deliberately long-lived connection; the API's own 15s
        # keepalive ping keeps it well within any reasonable timeout anyway.
        location /api/events/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1d;
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering "no" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        }

        # API routing
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        }

        # Customer Portal routing
        location = /portal {

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
            proxy_pass http://portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /portal/_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /portal/ {

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
            proxy_pass http://portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Admin static assets (immutable, 1 year)
        location /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        # Admin image/media assets (stale-while-revalidate 1h)
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot|webp|avif)$ {
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
            proxy_pass http://admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /docs {

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
            proxy_pass http://admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Bare "/" goes straight into the app. (dashboard) layout already
        # bounces unauthenticated users to /login server-side, so this is
        # safe for both logged-in and logged-out visitors.
        location = / {

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
            proxy_pass http://admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Admin Web (dashboard) at root. Every path other than /api/*,
        # /docs, /portal, and static assets (all handled by the location
        # blocks above) is an app route (login, register, dashboard,
        # customers, settings, ...) served by admin-web on arofi.net.
        location / {

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
            proxy_pass http://admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
