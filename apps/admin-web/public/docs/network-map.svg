<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">AROFi network architecture</title><desc id="d">A customer phone connects through an access point and MikroTik router to AROFi cloud services, RADIUS, payments and the business dashboard.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/></filter></defs><rect width="1400" height="760" rx="34" fill="url(#bg)"/><text x="70" y="78" font-family="Segoe UI,Arial" font-size="40" font-weight="750" fill="#152238">How AROFi connects the whole service</text><text x="70" y="118" font-family="Segoe UI,Arial" font-size="21" fill="#667085">Customer access, router enforcement, payments, RADIUS and reporting in one operating path.</text><g stroke="#93a4bd" stroke-width="5" fill="none" stroke-linecap="round"><path d="M260 388H432"/><path d="M648 388H780"/><path d="M1012 388h118"/><path d="M895 305V196"/><path d="M895 472v107"/></g><g font-family="Segoe UI,Arial" filter="url(#s)"><g transform="translate(72 260)"><rect width="188" height="256" rx="28" fill="#fff"/><rect x="48" y="27" width="92" height="168" rx="20" fill="#0f172a"/><rect x="56" y="39" width="76" height="136" rx="13" fill="#dbeafe"/><circle cx="94" cy="185" r="6" fill="#64748b"/><path d="M74 88c11-11 29-11 40 0M82 101c7-7 17-7 24 0M91 114h6" stroke="#2463eb" stroke-width="5" fill="none" stroke-linecap="round"/><text x="94" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Customer device</text></g><g transform="translate(432 272)"><rect width="216" height="232" rx="28" fill="#fff"/><ellipse cx="108" cy="70" rx="62" ry="26" fill="#eef2f7" stroke="#cbd5e1" stroke-width="3"/><path d="M74 72c17-17 51-17 68 0M89 87c10-10 28-10 38 0M104 102h8" fill="none" stroke="#22a35a" stroke-width="6" strok