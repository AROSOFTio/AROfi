name: Emergency recover AROFi production routing

on:
  push:
    paths:
      - '.github/workflows/recover-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Inspect AROFi edge route
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect edge routing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $key = Join-Path $env:USERPROFILE '.ssh\arofi-production-actions'
          if (-not (Test-Path $key)) { throw 'AROFi SSH key missing.' }
          $command = "echo '=== INTERNAL AROFI ==='; docker exec arofi-api-v2-20260809-api-1-pre-load-tune-20260826-221759 sh -lc 'wget -qO- http://127.0.0.1:3000/api/health'; echo; echo '=== EDGE TO AROFI ==='; docker exec edge-nginx sh -lc 'wget -S -O- http://arofi-nginx-v2-20260809:3000/api/health 2>&1' || true; echo '=== EDGE MOUNTS ==='; docker inspect edge-nginx --format '{{range .Mounts}}{{println .Source \"->\" .Destination}}{{end}}'; echo '=== AROFI ROUTE REFERENCES ==='; docker exec edge-nginx nginx -T 2>&1 | grep -n -B 8 -A 25 -E 'arofi\.net|arofi-nginx' || true; echo '=== PUBLIC ==='; curl -sS -D - -o /tmp/arofi-body --max-time 20 https://arofi.net/api/health || true; cat /tmp/arofi-body 2>/dev/null || true"
          $sshArgs = @('-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=accept-new','-o','ConnectTimeout=15','-i',$key)
          & ssh.exe @sshArgs 'root@95.111.234.34' $command
          if ($LASTEXITCODE -ne 0) { throw "Edge inspection failed: $LASTEXITCODE" }
