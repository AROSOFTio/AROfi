<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Voucher workflow</title><desc id="d">Illustration of assigning voucher stock to an agent, generating codes, previewing a PDF and redeeming a QR code.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf5ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/></filter></defs><rect width="1400" height="760" rx="34" fill="url(#bg)"/><text x="70" y="78" font-family="Segoe UI,Arial" font-size="40" font-weight="760" fill="#172033">Voucher stock, printing and redemption</text><text x="70" y="116" font-family="Segoe UI,Arial" font-size="21" fill="#667085">Every batch stays linked to its owner, agent, location, package and sale history.</text><g font-family="Segoe UI,Arial" filter="url(#s)"><g transform="translate(60 180)"><rect width="280" height="430" rx="28" fill="#fff"/><circle cx="140" cy="92" r="52" fill="#eef4ff"/><circle cx="140" cy="80" r="22" fill="#2463eb" opacity=".85"/><path d="M95 146c10-41 80-41 90 0" fill="#2463eb" opacity=".85"/><text x="140" y="186" text-anchor="middle" font-size="23" font-weight="750" fill="#172033">Assign stock</text><text x="140" y="219" text-anchor="middle" font-size="16" fill="#667085">Enoch · Kansanga</text><rect x="40" y="258" width="200" height="48" rx="10" fill="#f8fafc" stroke="#d7dfeb"/><text x="60" y="288" font-size="15" font-weight="650" fill="#344054">Package: Lite</text><rect x="40" y="318" width="200" height="48" rx="10" fill="#f8fafc" stroke="#d7dfeb"/><text x="60" y="348" font-size="15" font-weight="650" fill="#344054">Quantity: 100</text><rect x="40" y="378" width="200" height="32" rx="16" fill="#ecfdf3"/><text x="140" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#087443">Accountable agent stock</text></g><g transform="translate(380 180)"><rect width="280" height="430" rx="28" fill="#fff"/><g transform="translate(52 38)"><rect width="176" height="150" rx="16" fill="#f8fafc" stroke="#d7dfeb"/><path d="M20 30h70M20 50h116M20 70h92" stroke="#98a2b3" stroke-width="6" stroke-linecap="round"/><g transform="translate(118 88)"><rect width="42" height="42" fill="#111827"/><path d="M5 5h10v10H5zM27 5h10v10H27zM5 27h10v10H5zM22 22h5v5h-5zM30 27h7v10h-7z" fill="#fff"/></g><text x="20" y="128" font-size="13" font-weight="700" fill="#172033">AGENT: ENOCH · KANSANGA</text></g><text x="140" y="226" text-anchor="middle" font-size="23" font-weight="750" fill="#172033">Generate &amp; preview</text><text x="140" y="258" text-anchor="middle" font-size="15" fill="#667085">Uppercase · 8 characters</text><rect x="38" y="292" width="204" height="44" rx="10" fill="#2463eb"/><text x="140" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Preview PDF</text><rect x="38" y="348" width="98" height="42" rx="10" fill="#fff" stroke="#cfd8e6"/><text x="87" y="374" text-anchor="middle" font-size="14" font-weight="650" fill="#344054">Download</text><rect x="144" y="348" width="98" height="42" rx="10" fill="#fff" stroke="#cfd8e6"/><text x="193" y="374" text-anchor="middle" font-size="14" font-weight="650" fill="#344054">Share</text></g><g transform="translate(700 180)"><rect width="280" height="430" rx="28" fill="#fff"/><text x="30" y="52" font-size="16" fill="#667085">Batch name</text><text x="30" y="86" font-size="18" font-weight="750" fill="#172033">Voucher-Enoch-</text><text x="30" y="112" font-size="18" font-weight="750" fill="#172033">Kansanga-Lite-</text><text x="30" y="138" font-size="18" font-weight="750" fill="#172033">AUGUST-0001</text><rect x="30" y="176" width="220" height="112" rx="16" fill="#f8fafc" stroke="#d7dfeb"/><text x="48" y="207" font-size="14" fill="#667085">Voucher code</text><text x="48" y="247" font-size="28" font-weight="800" letter-spacing="3" fill="#172033">K8W4Q2XP</text><text x="48" y="276" font-size="14" fill="#667085">Lite · UGX 500</text><text x="140" y="330" text-anchor="middle" font-size="23" font-weight="750" fill="#172033">Traceable stock</text><text x="140" y="364" text-anchor="middle" font-size="15" fill="#667085">Owner, location, package, month</text><text x="140" y="389" text-anchor="middle" font-size="15" fill="#667085">and sequence stay visible.</text></g><g transform="translate(1020 180)"><rect width="320" height="430" rx="28" fill="#fff"/><rect x="88" y="38" width="144" height="236" rx="24" fill="#111827"/><rect x="98" y="52" width="124" height="192" rx="16" fill="#eef4ff"/><g transform="translate(126 80)"><rect width="68" height="68" fill="#111827"/><path d="M7 7h18v18H7zM43 7h18v18H43zM7 43h18v18H7zM34 34h9v9h-9zM47 43h14v18H47zM34 52h8v9h-8z" fill="#fff"/></g><rect x="116" y="164" width="88" height="42" rx="10" fill="#2463eb"/><text x="160" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Redeem</text><circle cx="160" cy="260" r="7" fill="#64748b"/><text x="160" y="320" text-anchor="middle" font-size="23" font-weight="750" fill="#172033">Scan and connect</text><text x="160" y="353" text-anchor="middle" font-size="15" fill="#667085">The portal reads the code,</text><text x="160" y="378" text-anchor="middle" font-size="15" fill="#667085">redeems it and activates access.</text></g></g><g stroke="#9aa8bd" stroke-width="5" fill="none" stroke-linecap="round"><path d="M340 395h40"/><path d="M660 395h40"/><path d="M980 395h40"/></g></svg>