name: Deploy AROFi Stack

on:
  push:
    branches:
      - main

jobs:
  build-verify:
    name: Verify Builds Pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install root dependencies
        run: npm ci

      - name: Apply guarded production source patches
        run: |
          python3 scripts/apply_iotec_source_patches.py
          python3 scripts/apply_unified_gateway_patches.py
          python3 scripts/apply_gateway_webhook_patches.py
          python3 scripts/hide_pesapal_gateway.py
          python3 scripts/apply_voucher_preview_patches.py
          python3 scripts/apply_voucher_dashboard_patches.py
          python3 scripts/finalize_voucher_dashboard.py

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Build all apps
        run: npx turbo run build --cache-dir=.turbo
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM || '' }}

      - name: Run tests
        run: npx turbo run test --cache-dir=.turbo
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM || '' }}

  deploy:
    name: Deploy to Production
    needs: [build-verify]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            echo "=== Switching to deployment root ==="
            cd /www/wwwroot

            if [ -d ".git" ]; then
              echo "Using repository in /www/wwwroot"
            elif [ -d "arofi.arosoft.io/.git" ]; then
              cd /www/wwwroot/arofi.arosoft.io
              echo "Using repository in /www/wwwroot/arofi.arosoft.io"
            elif [ -d "arofi-stack/.git" ]; then
              cd /www/wwwroot/arofi-stack
              echo "Using repository in /www/wwwroot/arofi-stack"
            elif [ -d "AROfi/.git" ]; then
              cd /www/wwwroot/AROfi
              echo "Using repository in /www/wwwroot/AROfi"
            else
              echo "No git repository found under /www/wwwroot"
              exit 1
            fi

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Building and restarting containers ==="
            docker compose pull --ignore-buildable
            docker compose build --no-cache
            docker compose up -d --remove-orphans

            echo "=== Waiting for API to be healthy ==="
            sleep 10

            echo "=== Applying database schema ==="
            docker compose exec -T api npx prisma migrate deploy

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "=== Deploy complete ==="
            docker compose ps
