name: Emergency recover AROFi production routing

on:
  push:
    paths:
      - '.github/workflows/recover-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Inspect edge vhost layout
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect edge configuration layout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $key = Join-Path $env:USERPROFILE '.ssh\arofi-production-actions'
          $remote = @'
          set -e
          echo '=== CONF FILES ==='
          ls -la /opt/infrastructure/proxy/nginx/conf.d
          echo '=== SERVER NAMES ==='
          grep -R -n -E 'server_name|proxy_pass|ssl_certificate' /opt/infrastructure/proxy/nginx/conf.d 2>/dev/null || true
          echo '=== CERT FILES ==='
          find /opt/infrastructure/proxy/certs -maxdepth 3 -type f -printf '%p\n' 2>/dev/null | sort
          echo '=== NGINX LISTENERS ==='
          docker exec edge-nginx nginx -T 2>&1 | grep -n -E 'listen .*443|listen .*80|server_name' || true
          '@
          $remote = $remote.Replace("`r`n", "`n").Replace("`r", "`n")
          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($remote))
          $sshArgs = @('-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=accept-new','-o','ConnectTimeout=15','-i',$key)
          & ssh.exe @sshArgs 'root@95.111.234.34' "echo '$encoded' | base64 -d | bash"
          if ($LASTEXITCODE -ne 0) { throw "Inspection failed: $LASTEXITCODE" }
