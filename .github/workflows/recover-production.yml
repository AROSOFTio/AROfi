name: Emergency recover AROFi production routing

on:
  push:
    paths:
      - '.github/workflows/recover-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Inspect pre-change shared edge state
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect snapshot and exact edge block
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $key = Join-Path $env:USERPROFILE '.ssh\arofi-production-actions'
          $remote = @'
          echo '=== RECOVERY SNAPSHOTS ==='
          find /root/arofi-emergency-recovery -maxdepth 2 -type f -name 'edge-before.json' -printf '%h\n' 2>/dev/null | sort || true

          SNAP="$(find /root/arofi-emergency-recovery -maxdepth 2 -type f -name 'edge-before.json' 2>/dev/null | sort | head -n 1)"
          echo "snapshot=$SNAP"

          echo '=== WEB-E11 IN PRE-CHANGE EDGE SNAPSHOT ==='
          if [ -n "$SNAP" ]; then
            grep -n -C 3 'web-e11rcq00bwhs567qffc8iuhz-142013732610' "$SNAP" || echo 'NOT_PRESENT_IN_SNAPSHOT'
          fi

          echo '=== CURRENT EDGE MEMBERSHIP ==='
          docker network inspect edge --format '{{range .Containers}}{{println .Name .IPv4Address}}{{end}}' 2>&1 | grep -E 'edge-nginx|arofi-nginx|pesapal-app|web-e11' || true

          echo '=== CURRENT WEB-E11 STATUS ==='
          docker inspect web-e11rcq00bwhs567qffc8iuhz-142013732610 --format 'status={{.State.Status}} restart={{.RestartCount}} networks={{json .NetworkSettings.Networks}}' 2>&1 || true

          echo '=== WEB-E11 LAST 50 LOG LINES ==='
          docker logs --tail 50 web-e11rcq00bwhs567qffc8iuhz-142013732610 2>&1 || true

          echo '=== AROSOFTLABS HTTPS BLOCK ==='
          awk 'BEGIN{p=0} /server_name arosoftlabs\.com www\.arosoftlabs\.com;/{p=1} p{print} p && /^}/{exit}' /opt/infrastructure/proxy/nginx/conf.d/https.conf 2>/dev/null || true

          echo '=== AROFI HTTPS BLOCK ==='
          awk 'BEGIN{p=0} /server_name arofi\.net;/{p=1} p{print} p && /^}/{exit}' /opt/infrastructure/proxy/nginx/conf.d/https.conf 2>/dev/null || true

          echo '=== PESAPAL HTTPS BLOCK ==='
          awk 'BEGIN{p=0} /server_name pesapal\.owltechsolutionsltd\.com;/{p=1} p{print} p && /^}/{exit}' /opt/infrastructure/proxy/nginx/conf.d/https.conf 2>/dev/null || true

          echo '=== NGINX TEST ==='
          docker exec edge-nginx nginx -t 2>&1 || true
          '@
          $remote = $remote.Replace("`r`n", "`n").Replace("`r", "`n")
          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($remote))
          $sshArgs = @('-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=accept-new','-o','ConnectTimeout=15','-i',$key)
          & ssh.exe @sshArgs 'root@95.111.234.34' "echo '$encoded' | base64 -d | bash"
          if ($LASTEXITCODE -ne 0) { throw "Inspection failed: $LASTEXITCODE" }
