name: Self-hosted runner smoke

on:
  push:
    branches:
      - perf/reduce-dashboard-load-20260826
  workflow_dispatch:

jobs:
  smoke:
    name: Runner accepts jobs
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Prove runner execution
        shell: powershell
        run: |
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Self-hosted runner accepted this job."
