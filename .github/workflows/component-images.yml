name: Build staging release images

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-api:
    uses: ./.github/workflows/reusable-component-image.yml
    with:
      component: api
      dockerfile: Dockerfile.components
      target: api-runtime
      channel: staging

  publish-admin:
    uses: ./.github/workflows/reusable-component-image.yml
    with:
      component: admin
      dockerfile: Dockerfile.components
      target: admin-runtime
      channel: staging

  publish-portal:
    uses: ./.github/workflows/reusable-component-image.yml
    with:
      component: portal
      dockerfile: Dockerfile.components
      target: portal-runtime
      channel: staging

  publish-nginx:
    uses: ./.github/workflows/reusable-component-image.yml
    with:
      component: nginx
      dockerfile: Dockerfile.components
      target: nginx-runtime
      channel: staging

  publish-freeradius:
    uses: ./.github/workflows/reusable-component-image.yml
    with:
      component: freeradius
      dockerfile: config/freeradius/Dockerfile
      channel: staging

  publish-backup:
    uses: ./.github/workflows/reusable-component-image.yml
    with:
      component: backup
      dockerfile: config/backup/Dockerfile
      channel: staging
