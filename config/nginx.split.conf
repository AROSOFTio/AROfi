worker_processes auto;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # --- TCP optimisations ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 200;
    reset_timedout_connection on;

    # --- Buffer tuning ---
    client_body_buffer_size 16k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --- Gzip (broad compatibility) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript text/xml text/x-component
        application/javascript application/json application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/truetype font/opentype
        application/vnd.ms-fontobject application/x-font-ttf;

    # --- Logging ---
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # --- WebSocket upgrade map ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Coolify's outer proxy (Traefik) terminates TLS and forwards plain HTTP
    # to this container, so nginx's own $scheme here is ALWAYS "http" even
    # when the real client connected over HTTPS. Blindly forwarding $scheme
    # downstream as X-Forwarded-Proto would tell the Node apps every request
    # is insecure. Preserve whatever X-Forwarded-Proto Traefik already set;
    # only fall back to $scheme for direct/local access with no proxy in front.
    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Split-deployment mode: api/admin/portal each run in their own Coolify
    # application container on the same Docker network. Docker's embedded DNS
    # can return IPv6 records on this host, while the Next/Nest containers only
    # listen on IPv4. Resolve through Docker DNS with IPv6 disabled to avoid
    # intermittent "connection refused" during dashboard/session/API calls.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $api_backend arofi-api-v2:3000;
    set $admin_backend arofi-admin-v2:3000;
    set $portal_backend arofi-portal-v2:3000;

    # Plain HTTP MikroTik bootstrap endpoint, exposed by docker-compose on
    # host port 18080. This intentionally serves only router bootstrap assets;
    # the admin dashboard, portal, and general API remain behind the HTTPS
    # Coolify proxy.
    server {
        listen 3001;
        server_name _;

        location /api/mikrotik/ {
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        }

        location = /api/health {
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto http;
            add_header Cache-Control "no-store" always;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 3000;
        server_name arofi.arosoftlabs.com arofi.net app.arofi.net _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "geolocation=(), microphone=()" always;

        # Single-domain consolidation: retire app.arofi.net -> 301 to arofi.net.
        if ($host = app.arofi.net) {
            return 301 https://arofi.net$request_uri;
        }
        # Legacy domain from before the arofi.net migration — same treatment.
        if ($host = arofi.arosoftlabs.com) {
            return 301 https://arofi.net$request_uri;
        }

        # Admin realtime SSE stream (/api/events/stream). Must come BEFORE the
        # general /api/ block (nginx picks the longest matching prefix, so
        # this wins for these paths regardless of file order, but keeping it
        # first is clearer to read). Default proxy_buffering would hold each
        # event in nginx's buffer instead of flushing it immediately,
        # silently turning a "<2 second" realtime dashboard into one that
        # updates only every few seconds (or on buffer flush) — defeating the
        # entire point of the SSE bus. proxy_read_timeout is generous because
        # this is a deliberately long-lived connection; the API's own 15s
        # keepalive ping keeps it well within any reasonable timeout anyway.
        location /api/events/ {
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1d;
            chunked_transfer_encoding off;
            add_header X-Accel-Buffering "no" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        }

        # API routing
        location /api/ {
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        }

        # Customer Portal routing
        location = /portal {

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
            proxy_pass http://$portal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /portal/_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://$portal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /portal/ {

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
            proxy_pass http://$portal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Admin static assets (immutable, 1 year)
        location /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://$admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        # Admin image/media assets (stale-while-revalidate 1h)
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot|webp|avif)$ {
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600" always;
            proxy_pass http://$admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location /docs {

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
            proxy_pass http://$admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Bare "/" goes straight into the app. (dashboard) layout already
        # bounces unauthenticated users to /login server-side, so this is
        # safe for both logged-in and logged-out visitors.
        location = / {

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
            proxy_pass http://$admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Admin Web (dashboard) at root. Every path other than /api/*,
        # /docs, /portal, and static assets (all handled by the location
        # blocks above) is an app route (login, register, dashboard,
        # customers, settings, ...) served by admin-web on arofi.net.
        location / {

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            expires off;
            proxy_pass http://$admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
